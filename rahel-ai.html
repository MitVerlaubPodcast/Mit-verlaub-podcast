<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rahel AI – Mit Verlaub</title>
<style>
*{box-sizing:border-box}
:root{--wa-green:#075e54;--wa-light:#d9fdd3;--wa-paper:#efeae2;--wa-ink:#111b21}
body{margin:0;background:#e8e5df;color:var(--wa-ink);font-family:Arial,Helvetica,sans-serif}
header{background:var(--wa-green);color:#fff;padding:15px 20px}
header a{color:#fff;text-decoration:none;font-weight:bold;display:flex;align-items:center;gap:11px;max-width:900px;margin:0 auto}
.site-mark{width:38px;height:38px;border-radius:50%;background:#d9fdd3;color:var(--wa-green);display:grid;place-items:center;font-size:19px;font-weight:800}
main{max-width:900px;margin:0 auto;padding:24px 16px 42px}
.intro{text-align:center;margin:0 0 18px}
h1{font-size:clamp(25px,5vw,36px);margin:8px 0;color:#172b24}
.chat{background:var(--wa-paper);border-radius:16px;box-shadow:0 8px 30px #0000001c;overflow:hidden;display:flex;flex-direction:column;height:min(72vh,760px);min-height:470px;border:1px solid #d8d2c8}
.chat-head{background:var(--wa-green);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 4px #00000014}
.avatar{width:42px;height:42px;border-radius:50%;background:#d9fdd3;color:var(--wa-green);display:grid;place-items:center;font-size:21px;font-weight:800;flex-shrink:0}
.chat-head strong{font-size:16px;display:block}
.chat-head small{display:block;color:#d7eee9;margin-top:3px;font-size:12px}
.messages{padding:22px clamp(12px,4vw,30px);display:flex;flex-direction:column;gap:12px;flex:1;overflow:auto;scroll-behavior:smooth;background-color:var(--wa-paper);background-image:radial-gradient(#bdb7ad35 0.8px,transparent 0.8px);background-size:18px 18px}
.message{position:relative;max-width:min(78%,520px);padding:10px 13px 8px;border-radius:9px;line-height:1.48;white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px;box-shadow:0 1px 1px #00000012}
.bot{align-self:flex-start;background:#fff;border-top-left-radius:2px}
.user{align-self:flex-end;background:var(--wa-light);border-top-right-radius:2px}
.composer{background:#f0f2f5;display:flex;align-items:flex-end;gap:10px;padding:12px;border-top:1px solid #d9dfe2}
textarea{font:inherit;resize:none;min-height:46px;max-height:130px;flex:1;border:0;outline:none;border-radius:24px;padding:13px 17px;background:#fff;color:var(--wa-ink);box-shadow:0 1px 2px #0000000b}
textarea:focus{box-shadow:0 0 0 2px #128c7e33}
.send{width:46px;height:46px;flex:0 0 46px;border:0;background:var(--wa-green);color:#fff;border-radius:50%;display:grid;place-items:center;cursor:pointer;transition:background .15s}
.send:hover{background:#08766a}
.send:disabled{opacity:.55;cursor:wait}
.send svg{width:21px;height:21px;fill:currentColor}
.back{text-align:center;margin-top:20px}
.back a{color:#275f55;text-decoration:none;font-weight:600}
.back a:hover{text-decoration:underline}
footer{text-align:center;color:#777;font-size:13px;padding:0 16px 25px}
@media(max-width:520px){header{padding:12px 14px}main{padding:18px 0 30px}.intro{padding:0 12px}.chat{height:calc(100dvh - 178px);min-height:430px;border-radius:0;border-left:0;border-right:0}.chat-head{padding:10px 14px}.messages{padding:18px 12px;gap:10px}.message{max-width:88%;font-size:14.5px}.composer{padding:9px;gap:8px}.back{margin-top:17px}}
</style>
</head>
<body>
<header><a href="index.html"><span class="site-mark">R</span><span>Rahel AI</span></a></header>
<main>
<section class="intro">
<h1>Stelle Rahel eine Frage.</h1>
</section>
<section class="chat" aria-label="Chat mit Rahel AI">
<div class="chat-head"><div class="avatar" aria-hidden="true">R</div><div><strong>Rahel AI</strong><small>Mit Verlaub</small></div></div>
<div class="messages" id="messages" aria-live="polite">
<div class="message bot">Na, was liegt dir auf dem Herzen?</div>
</div>
<form class="composer" id="chat-form">
<textarea id="prompt" maxlength="1000" placeholder="Nachricht schreiben" aria-label="Deine Frage" rows="1" required></textarea>
<button class="send" id="send" type="submit" aria-label="Nachricht senden" title="Senden"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.01 21 23 12 2.01 3 2 10l15 2-15 2z"/></svg></button>
</form>
</section>
<div class="back"><a href="index.html">← Zurück zu Mit Verlaub</a></div>
</main>
<script>
const messages=document.getElementById('messages');
const form=document.getElementById('chat-form');
const promptBox=document.getElementById('prompt');
const sendButton=document.getElementById('send');
function addMessage(text,who){const el=document.createElement('div');el.className='message '+who;el.textContent=text;messages.appendChild(el);messages.scrollTop=messages.scrollHeight;return el}
async function sendMessage(text){
 const question=(text||'').trim();if(!question||sendButton.disabled)return;
 addMessage(question,'user');promptBox.value='';promptBox.style.height='auto';sendButton.disabled=true;
 const pending=addMessage('Rahel tippt …','bot');
 try{
  const response=await fetch('https://aabwjvqfelqjclfqxhhs.supabase.co/functions/v1/rahel-ai',{method:'POST',headers:{'Content-Type':'application/json','apikey':'sb_publishable_gQfgbLPNQimxEX4pGDRicQ_f_8MCcrq'},body:JSON.stringify({message:question})});
  const data=await response.json();
  if(!response.ok)throw new Error(data.error||'Bitte versuch es gleich nochmal.');
  pending.textContent=data.reply;
 }catch(e){pending.textContent=e instanceof Error&&e.message?e.message:'Die Anfrage ist fehlgeschlagen. Bitte versuch es nochmal.'}
 finally{sendButton.disabled=false;promptBox.focus();messages.scrollTop=messages.scrollHeight}
}
form.addEventListener('submit',e=>{e.preventDefault();sendMessage(promptBox.value)});
promptBox.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();form.requestSubmit()}});
promptBox.addEventListener('input',()=>{promptBox.style.height='auto';promptBox.style.height=Math.min(promptBox.scrollHeight,130)+'px'});
</script>
</body>
</html>
