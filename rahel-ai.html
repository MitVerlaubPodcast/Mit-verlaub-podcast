<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rahel AI – Mit Verlaub</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f5f5;color:#222;font-family:Arial,Helvetica,sans-serif}
header{background:#000;color:#fff;text-align:center;padding:24px 16px}
header a{color:#fff;text-decoration:none;font-weight:bold}
main{max-width:760px;margin:0 auto;padding:32px 16px 60px}
.intro{text-align:center;margin-bottom:24px}
h1{font-size:clamp(30px,6vw,44px);margin:12px 0}
.intro p{color:#666;line-height:1.6}
.disclaimer{font-size:13px;background:#fff3cd;border:1px solid #ffe69c;padding:10px 14px;border-radius:10px;color:#664d03}
.chat{background:#fff;border-radius:18px;box-shadow:0 8px 30px #00000012;overflow:hidden;display:flex;flex-direction:column;min-height:500px}
.chat-head{background:#111;color:#fff;padding:18px 20px}
.chat-head strong{font-size:18px}
.chat-head small{display:block;color:#ccc;margin-top:5px}
.messages{padding:20px;display:flex;flex-direction:column;gap:14px;flex:1;max-height:55vh;overflow:auto}
.message{max-width:88%;padding:12px 15px;border-radius:16px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.bot{align-self:flex-start;background:#f0f0f0;border-bottom-left-radius:5px}
.user{align-self:flex-end;background:#171717;color:white;border-bottom-right-radius:5px}
.suggestions{display:flex;flex-wrap:wrap;gap:8px;padding:0 18px 14px}
.suggestions button{border:1px solid #ddd;border-radius:18px;background:white;padding:8px 12px;cursor:pointer}
.composer{border-top:1px solid #eee;display:flex;gap:10px;padding:14px}
textarea{font:inherit;resize:vertical;min-height:46px;max-height:130px;flex:1;border:1px solid #ddd;border-radius:12px;padding:12px}
.send{border:0;background:#111;color:#fff;border-radius:12px;padding:0 18px;font-weight:bold;cursor:pointer}
.send:disabled{opacity:.5;cursor:wait}
.back{text-align:center;margin-top:24px}
.back a{color:#222}
footer{text-align:center;color:#777;font-size:13px;padding:0 16px 30px}
@media(max-width:520px){main{padding:22px 12px 40px}.chat{min-height:65vh}.messages{max-height:none}.message{max-width:95%}.composer{padding:10px}.send{padding:0 14px}}
</style>
</head>
<body>
<header><a href="index.html">Rahel AI</a></header>
<main>
<section class="intro">
<h1>Stelle Rahel eine Frage.</h1>
</section>
<section class="chat" aria-label="Chat mit Rahel AI">
<div class="chat-head"><strong>Rahel AI</strong></div>
<div class="messages" id="messages" aria-live="polite">
<div class="message bot">Na, was liegt dir auf dem Herzen?</div>
</div>
<form class="composer" id="chat-form">
<textarea id="prompt" maxlength="1000" placeholder="Deine Nachricht …" aria-label="Deine Frage" required></textarea>
<button class="send" id="send" type="submit">Senden</button>
</form>
</section>
<div class="back"><a href="index.html">← Zurück</a></div>
</main>
<script>
const messages=document.getElementById('messages');
const form=document.getElementById('chat-form');
const promptBox=document.getElementById('prompt');
const sendButton=document.getElementById('send');
function addMessage(text,who){const el=document.createElement('div');el.className='message '+who;el.textContent=text;messages.appendChild(el);messages.scrollTop=messages.scrollHeight;return el}
async function sendMessage(text){
 const question=(text||'').trim();if(!question||sendButton.disabled)return;
 addMessage(question,'user');promptBox.value='';sendButton.disabled=true;sendButton.textContent='Senden …';
 const pending=addMessage('Rahel tippt …','bot');
 try{
  const response=await fetch('https://aabwjvqfelqjclfqxhhs.supabase.co/functions/v1/rahel-ai',{method:'POST',headers:{'Content-Type':'application/json','apikey':'sb_publishable_gQfgbLPNQimxEX4pGDRicQ_f_8MCcrq'},body:JSON.stringify({message:question})});
  const data=await response.json();
  if(!response.ok)throw new Error(data.error||'Bitte versuch es gleich nochmal.');
  pending.textContent=data.reply;
 }catch(e){pending.textContent='Ich bin kurz gedanklich durchs offene Fenster gefallen. Versuch es bitte nochmal.'}
 finally{sendButton.disabled=false;sendButton.textContent='Senden';promptBox.focus();messages.scrollTop=messages.scrollHeight}
}
form.addEventListener('submit',e=>{e.preventDefault();sendMessage(promptBox.value)});
promptBox.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();form.requestSubmit()}});
</script>
</body>
</html>
